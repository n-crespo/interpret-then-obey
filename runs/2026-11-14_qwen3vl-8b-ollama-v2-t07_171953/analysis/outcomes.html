function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// Draw one mark. `border` null = no border (a thin surface-coloured gap only).
function shape(kind, x, y, r, color, border, parent) {
  const pts = (list) => list.map(([a, b]) => `${x + a * r},${y + b * r}`).join(" ");
  const stroke = border
    ? { stroke: css("--text"), "stroke-width": 2, "stroke-dasharray": border.dash, "stroke-linejoin": "round" }
    : { stroke: css("--surface"), "stroke-width": 1.5 };
  const attrs = { fill: color, ...stroke };
  switch (kind) {
    case "circle": return el("circle", { cx: x, cy: y, r, ...attrs }, parent);
    case "square": return el("rect", { x: x - r * 0.88, y: y - r * 0.88, width: r * 1.76, height: r * 1.76, rx: 2, ...attrs }, parent);
    case "triangle": return el("polygon", { points: pts([[0, -1.2], [1.15, 0.9], [-1.15, 0.9]]), ...attrs }, parent);
    case "triangleDown": return el("polygon", { points: pts([[0, 1.2], [1.15, -0.9], [-1.15, -0.9]]), ...attrs }, parent);
    case "diamond": return el("polygon", { points: pts([[0, -1.25], [1.25, 0], [0, 1.25], [-1.25, 0]]), ...attrs }, parent);
    default: {
      const p = [];
      for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 3; p.push([Math.cos(a) * 1.15, Math.sin(a) * 1.15]); }
      return el("polygon", { points: pts(p), ...attrs }, parent);
    }
  }
}

function swatch(kind, color, border) {
  const s = el("svg", { width: 20, height: 20, viewBox: "0 0 20 20", "aria-hidden": "true" });
  shape(kind, 10, 10, 6.5, color, border, s);
  return s;
}

function buildLegends() {
  const add = (id, group, keys, sw) => {
    const box = document.getElementById(id);
    box.querySelectorAll("button").forEach((b) => b.remove());
    for (const k of keys) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", active[group].has(k) ? "true" : "false");
      b.append(sw(k), document.createTextNode(pretty(k)));
      b.addEventListener("click", () => {
        const set = active[group];
        if (set.has(k)) set.delete(k); else set.add(k);
        b.setAttribute("aria-pressed", set.has(k) ? "true" : "false");
        applyFilter();
      });
      box.appendChild(b);
    }
  };
  const grey = css("--neutral");
  add("legend-rep", "rep", reps, (r) => swatch("circle", fill(r), null));
  add("legend-context", "context", contexts, (c) => swatch(shapeOf[c], grey, null));
  add("legend-prompt", "prompt", prompts, (p) => swatch("circle", grey, borderOf[p]));
}

function applyFilter() {
  document.querySelectorAll(".mark").forEach((m) => {
    const on = active.rep.has(m.dataset.rep) && active.context.has(m.dataset.context) && active.prompt.has(m.dataset.prompt);
    m.classList.toggle("dim", !on);
  });
}

const tip = document.getElementById("tip");
function showTip(d, evt) {
  tip.replaceChildren();
  const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; tip.appendChild(e); return e; };
  add("div", "id", d.id + (META.epochs > 1 ? ` (epoch ${d.epoch})` : ""));
  const o = OUTCOMES.find((x) => x.key === d.outcome);
  add("div", "outcome", `${o.label}: ${o.note}`);
  const dl = document.createElement("dl");
  for (const [k, v] of [["Representation", pretty(d.rep)], ["Context", pretty(d.context)], ["Prompt", d.prompt], ["Bought", d.calls.length ? d.calls.join("; ") : "nothing"], ["Stop reason", d.stop || "n/a"]]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  tip.appendChild(dl);
  if (d.error) add("div", "reply", "Error: " + d.error);
  else if (d.response) add("div", "reply", d.response.length > 320 ? d.response.slice(0, 320) + "…" : d.response);
  tip.style.display = "block";
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = Math.max(8, evt.clientY - h - pad);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function draw() {
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const W = Math.max(520, Math.min(1040, chart.clientWidth || 1040));
  const left = 160, step = 26, r = 8;
  const cellW = W - left;
  const perRow = Math.max(1, Math.floor((cellW - 64) / step));  // room for the count at the left
  const rank = (list) => Object.fromEntries(list.map((k, i) => [k, i]));
  const rr = rank(reps), cr = rank(contexts), pr = rank(prompts);
  const cells = {};
  for (const d of DATA) (cells[d.outcome] ??= []).push(d);
  for (const list of Object.values(cells)) {
    list.sort((a, b) => rr[a.rep] - rr[b.rep] || cr[a.context] - cr[b.context] || pr[a.prompt] - pr[b.prompt] || a.epoch - b.epoch);
  }
  const bandH = bands.map((b) => Math.max(64, Math.ceil((cells[b.key] || []).length / perRow) * step + 30));
  const H = bandH.reduce((a, b) => a + b, 0) + 4;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Outcome of every trial; colour is representation, shape is context, border is prompt" }, chart);

  let y = 0;
  bands.forEach((b, i) => {
    const h = bandH[i], list = cells[b.key] || [];
    el("rect", { x: left, y: y + 3, width: cellW, height: h - 6, rx: 6, fill: css("--band") }, svg);
    el("text", { x: 0, y: y + h / 2 - 2, class: "band-label" }, svg).textContent = b.label;
    el("text", { x: 0, y: y + h / 2 + 14, class: "band-note" }, svg).textContent = b.note;
    el("text", { x: left + 12, y: y + h / 2 + 4, class: "band-note" }, svg).textContent = String(list.length);
    const rows = Math.ceil(list.length / perRow);
    list.forEach((d, k) => {
      const row = Math.floor(k / perRow), col = k % perRow;
      const cx = left + 52 + col * step + step / 2;
      const cy = y + h / 2 + (row - (rows - 1) / 2) * step;
      const g = el("g", { class: "mark", tabindex: 0, "data-rep": d.rep, "data-context": d.context, "data-prompt": d.prompt }, svg);
      shape(shapeOf[d.context], cx, cy, r, fill(d.rep), borderOf[d.prompt], g);
      const hit = el("circle", { cx, cy, r: step / 2, class: "hit" }, g);
      hit.addEventListener("mouseenter", (e) => showTip(d, e));
      hit.addEventListener("mousemove", moveTip);
      hit.addEventListener("mouseleave", hideTip);
      g.addEventListener("focus", () => { const bb = g.getBoundingClientRect(); showTip(d, { clientX: bb.right, clientY: bb.bottom }); });
      g.addEventListener("blur", hideTip);
    });
    y += h;
  });
  applyFilter();
}

function buildTable() {
  const tb = document.querySelector("#table tbody");
  for (const d of DATA) {
    const tr = document.createElement("tr");
    const o = OUTCOMES.find((x) => x.key === d.outcome);
    for (const [v, cls] of [[d.id, "mono"], [o.label, ""], [d.calls.join("; ") || "nothing", ""], [(d.error ? "Error: " + d.error : d.response).slice(0, 200), ""]]) {
      const td = document.createElement("td"); td.textContent = v; if (cls) td.className = cls; tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
}

function buildHeader() {
  document.getElementById("sub").textContent = `${META.model} · ${META.run}`;
  const s = document.getElementById("stats");
  for (const [big, small] of META.stats) {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = big;
    const sp = document.createElement("span"); sp.textContent = small;
    d.append(b, sp); s.appendChild(d);
  }
}

buildHeader();
buildLegends();
buildTable();
draw();
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { buildLegends(); draw(); });
</script>
</body>
</html>

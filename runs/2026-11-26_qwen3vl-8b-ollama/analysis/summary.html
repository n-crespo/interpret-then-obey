  const rows = ROWS.filter(inScope), n = rows.length;
  const count = Object.fromEntries(ORDER.map(o => [o, rows.filter(r => r.o === o).length]));
  const unknown = rows.filter(r => !ORDER.includes(r.o) || r.l.some(l => !(l in DATA.labels)));
  const nb = ROWS.filter(r => r.base).length;
  document.getElementById("meta").innerHTML =
    `${esc(DATA.model)} · ${esc(DATA.run)} · <b>${ROWS.length}</b> trials (${ROWS.length - nb} injected, ${nb} baseline)`;
  const ck = document.getElementById("check");
  ck.className = "check " + (unknown.length ? "bad" : "ok");
  ck.innerHTML = unknown.length
    ? `<b>${unknown.length}</b> trials have an outcome or label this page does not know`
    : `Every trial has exactly one outcome: <b>${Object.values(count).reduce((a, b) => a + b, 0)}</b> of <b>${n}</b>. ` +
      `It counts under each of its labels, one per tool call.`;

  const bar = document.getElementById("bar"); bar.innerHTML = "";
  ORDER.filter(o => count[o]).forEach(o => {
    const d = document.createElement("div");
    d.style.flex = count[o]; d.style.background = col(o);
    if (sel && !(sel.kind === "o" ? sel.id === o : DATA.labels[sel.id] === o)) d.className = "dim";
    d.onmousemove = e => showTip(e, `<b>${INFO[o].name}</b><br>${count[o]} of ${n} · ${pct(count[o], n)}`);
    d.onmouseleave = hideTip;
    d.onclick = () => select({kind: "o", id: o});
    bar.appendChild(d);
  });

  const g = document.getElementById("groups"); g.innerHTML = "";
  ORDER.forEach(o => {
    if (o === "harness_error" && !count[o]) return;
    const el = document.createElement("div"); el.className = "grp";
    el.appendChild(row({kind: "o", id: o}, count[o], n, "", INFO[o].name, INFO[o].def));
    LABELS_OF[o].filter(l => l !== o)
      .map(l => [l, rows.filter(r => r.l.includes(l)).length]).sort((a, b) => b[1] - a[1])
      .forEach(([l, c]) => el.appendChild(row({kind: "l", id: l}, c, n, "label", l)));
    g.appendChild(el);
  });
  renderDetail(rows);
}
function select(s) { sel = same(sel, s) ? null : s; render(); }

function breakdown(title, rows, all, key) {
  const groups = {};
  all.forEach(r => { (groups[r[key] ?? "–"] ??= {n: 0, k: 0}).n++; });
  rows.forEach(r => { groups[r[key] ?? "–"].k++; });
  const lines = Object.entries(groups).filter(([, g]) => g.k).sort((a, b) => b[1].k / b[1].n - a[1].k / a[1].n)
    .map(([name, g]) => `<div class="l" title="${g.k} of ${g.n} ${esc(name)} trials"><span>${esc(name)}</span>
      <span class="t"><i style="width:${100 * g.k / g.n}%;background:${colOf(sel)}"></i></span><span>${g.k}/${g.n}</span></div>`).join("");
  return `<div class="bk"><h4>By ${title}</h4>${lines}</div>`;
}
function renderDetail(all) {
  const el = document.getElementById("detail");
  if (!sel) { el.innerHTML = `<div class="hint">Click an outcome or a label for a summary of every trial in it.</div>`; return; }
  const rows = all.filter(r => matches(r, sel));
  const calls = {};
  rows.forEach(r => { calls[r.d] = (calls[r.d] || 0) + 1; });
  const topCalls = Object.entries(calls).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([d, c]) => `<div class="l"><span title="${esc(d)}">${esc(d)}</span>
      <span class="t"><i style="width:${100 * c / rows.length}%;background:${colOf(sel)}"></i></span><span>${c}</span></div>`).join("");
  const title = sel.kind === "o" ? INFO[sel.id].name : sel.id;
  const def = sel.kind === "o" ? INFO[sel.id].def : `A label of ${INFO[DATA.labels[sel.id]].name.toLowerCase()}.`;
  el.innerHTML = `<h2><span class="sw" style="background:${colOf(sel)}"></span>${esc(title)}
      <span class="meta" style="font-weight:400">${rows.length} of ${all.length} trials · ${pct(rows.length, all.length)}</span></h2>
    <div class="def2">${esc(def)}</div>
    ${rows.length ? `<div class="cols">${breakdown("prompt", rows, all, "p")}${breakdown("context", rows, all, "c")}${breakdown("category", rows, all, "cat")}${breakdown("representation", rows, all, "rep")}</div>
    <div class="bk calls"><h4>Most common calls</h4>${topCalls}</div>
    <div class="samples">${rows.map(r => `<div class="s"><code>${esc(r.id)} · e${r.e}</code>
      <span class="call" title="${esc(r.d)}">${esc(r.d)}</span>
      <span class="lb">${esc(INFO[r.o]?.name ?? r.o)}: ${esc(r.l.join(", "))}</span>
      <span class="r">${esc(r.r)}</span></div>`).join("")}</div>`
    : `<div class="hint">No trials in this scope.</div>`}`;
}
document.querySelectorAll("#scope button").forEach(b => b.onclick = () => {
  scope = b.dataset.v;
  document.querySelectorAll("#scope button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
render();
</script>
</body>
</html>

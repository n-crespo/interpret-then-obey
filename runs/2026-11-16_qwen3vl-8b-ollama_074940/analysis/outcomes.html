function groupSummary(leaves) {

  if (kind === "no_target") return `${f("obeyed", "bought injected")} · ${f("followed_user", "followed user")} · ${f("misread_injection", "misread")}`;
  return Object.entries(c).map(([k, v]) => `${k} ${v}/${n}`).join(" · ");

function draw() {
  const W = chart.clientWidth;

  chart.innerHTML = "";
  const sq = d3.treemapSquarify.ratio(1.3);
  const tile = (node, x0, y0, x1, y1) => {
    if (node.depth < 2) return sq(node, x0, y0, x1, y1);
    const n = node.children.length, w = x1 - x0, h = y1 - y0;
    let best = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c); const a = (w / c) / (h / r); const s = Math.abs(Math.log(a / 1.4)) + (r * c - n) * 0.15; if (s < bestScore) { bestScore = s; best = c; } }
    const cols = best, cw = w / cols, ch = h / Math.ceil(n / cols);
    node.children.forEach((k, i) => { const c = i % cols, r = Math.floor(i / cols); k.x0 = x0 + c * cw; k.x1 = x0 + (c + 1) * cw; k.y0 = y0 + r * ch; k.y1 = y0 + (r + 1) * ch; });
  };
  d3.treemap().size([W, H]).tile(tile)

  // context groups

    }).each(function (d) { fit(this, d.x1 - d.x0 - 14); });
  cg.append("text").attr("x", d => d.x0 + 8).attr("y", d => d.y0 + 32).attr("font-size", 11.5).attr("fill", "var(--text-secondary)")

function fit(el, w) {
  let t = el.textContent;
  while (t.length > 2 && el.getComputedTextLength() > w) { t = t.slice(0, -1); el.textContent = t + "…"; }
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showTip(e, d) {
  tip.innerHTML = `<div class="id">${esc(d.id)}</div>
    <div class="meta">${esc(d.category)} · ${esc(d.attack_type)}${d.in_manifest ? "" : " · not in manifest"}${flags.has(d.id) ? " · <b style='color:var(--flag)'>flagged</b>" : ""}${isKeep(d) ? ` · <b>${esc(d.attack_type)}: keep (locked)</b>` : ""}</div>` +
    RUNS.map(r => {
      const ts = trialsOf(d, r);
      if (!ts.length) return `<div class="run"><b>${esc(r)}</b>: not run</div>`;
      return ts.map(t => `<div class="run"><i class="sw" style="background:${swatch(t.o)};vertical-align:-1px"></i> <b>${esc(r)}</b>${ts.length > 1 ? ` e${t.e}` : ""}: ${esc(OUT[t.o] || t.o)} — <span class="call">${esc(t.d)}</span>
        ${t.r ? `<div class="resp">${esc(t.r)}${t.r.length >= META.resp_chars ? "…" : ""}</div>` : ""}</div>`).join("");
    }).join("");
  tip.style.display = "block";
  const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tw > innerWidth - 8) x = e.clientX - tw - pad;
  if (y + th > innerHeight - 8) y = innerHeight - th - 8;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.style.display = "none"; }

function toggle(id) { if (KEEP.has(id)) return; flags.has(id) ? flags.delete(id) : flags.add(id); save(); draw(); }
function toggleGroup(g) {
  const ids = g.leaves().map(l => l.data).filter(x => x.in_manifest && !isKeep(x)).map(x => x.id);
  if (!ids.length) return;
  const all = ids.every(id => flags.has(id));
  ids.forEach(id => all ? flags.delete(id) : flags.add(id));
  save(); draw();
}

function updateSide() {

  const stat = (v, l) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`;
  const worked = inMan.filter(d => !flags.has(d.id))
    .reduce((a, d) => a + RUNS.reduce((b, r) => b + trialsOf(d, r).filter(t => WORKED.includes(t.o)).length, 0), 0);
  document.getElementById("stats").innerHTML =
    stat(inMan.length, "cases in manifest") + stat(flIn.length, "flagged") + stat(inMan.length - flIn.length, "would remain") +
    stat(worked, "attack successes kept") +
    (KEEP.size ? stat(inMan.filter(isKeep).length, `${esc(META.lock.join(", "))} cases locked`) : "") +
    (inMan.length < DATA.length ? stat(DATA.length - inMan.length, "not in manifest") : "");
  document.getElementById("flagTitle").textContent = `Flagged (${fl.length})`;
  document.getElementById("flagList").value = fl.map(d => d.id).join("\n");
}

document.getElementById("copy").onclick = async () => {
  const t = document.getElementById("flagList").value;
  try { await navigator.clipboard.writeText(t); document.getElementById("copied").textContent = "Copied"; }
  catch { document.getElementById("flagList").select(); document.getElementById("copied").textContent = "Selected — press Ctrl+C"; }
  setTimeout(() => document.getElementById("copied").textContent = "", 2000);
};
document.getElementById("clear").onclick = () => { flags = new Set(); save(); draw(); };

// table view
(function () {
  const cell = (d, r) => trialsOf(d, r).map(t => esc(OUT[t.o] || t.o) + " — " + esc(t.d)).join("; ") || "—";
  document.getElementById("tbl").innerHTML =
    `<thead><tr><th>id</th><th>attack type</th><th>in manifest</th>${RUNS.map(r => `<th>${esc(r)}</th>`).join("")}</tr></thead><tbody>` +
    DATA.map(d => `<tr><td class="mono">${esc(d.id)}</td><td>${esc(d.attack_type)}</td><td>${d.in_manifest ? "yes" : "no"}</td>${RUNS.map(r => `<td>${cell(d, r)}</td>`).join("")}</tr>`).join("") + "</tbody>";
})();

draw();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(draw, 120); }).observe(chart);
</script>
</body>
</html>

<!doctype html>
<!-- Template for runs/<dir>/analysis/outcomes.html, filled in by eval/analyze_results.py.
     The DATA and META placeholders in the script below are replaced with JSON.
     Self-contained: no network needed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Outcomes</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --surface-2: #f3f2ef;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #8a8984;
    --rule: #e4e3df;
    --band: #f6f5f2;
    --c1: #2a78d6;
    --c2: #eb6834;
    --c3: #1baf7a;
    --shape: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19;
      --surface-2: #242423;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --text-3: #8f8e86;
      --rule: #34342f;
      --band: #20201f;
      --c1: #3987e5;
      --c2: #d95926;
      --c3: #199e70;
      --shape: #c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19;
    --surface-2: #242423;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --rule: #34342f;
    --band: #20201f;
    --c1: #3987e5;
    --c2: #d95926;
    --c3: #199e70;
    --shape: #c3c2b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; background: var(--surface); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-2); margin: 0 0 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 18px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); font-size: 12.5px; }
  .legends { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 6px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .legend .title { color: var(--text-2); font-size: 12.5px; margin-right: 4px; }
  .legend button {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px;
    border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
    color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .legend button[aria-pressed="false"] { opacity: 0.4; }
  .legend button:focus-visible { outline: 2px solid var(--c1); outline-offset: 1px; }
  .hint { color: var(--text-3); font-size: 12px; margin: 0 0 8px; }
  .chart { width: 100%; overflow-x: auto; }
  svg { display: block; }
  svg text { fill: var(--text-2); font-size: 12px; }
  svg .band-label { fill: var(--text); font-size: 13px; font-weight: 600; }
  svg .band-note { fill: var(--text-3); font-size: 11.5px; }
  svg .col-label { fill: var(--text); font-size: 13px; }
  .mark { transition: opacity 120ms; }
  .mark.dim { opacity: 0.12; }
  .hit { cursor: pointer; fill: transparent; }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 360px; padding: 10px 12px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); font-size: 12.5px; display: none;
  }
  #tip .id { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--text-2); word-break: break-all; }
  #tip .outcome { font-weight: 600; margin: 4px 0; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
  #tip dt { color: var(--text-2); }
  #tip dd { margin: 0; }
  #tip .reply { color: var(--text-2); border-top: 1px solid var(--rule); padding-top: 6px; margin-top: 6px; white-space: pre-wrap; }
  details { margin-top: 22px; }
  summary { cursor: pointer; color: var(--text-2); }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .foot { color: var(--text-3); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>Run outcomes</h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <div class="legends">
    <div class="legend" id="legend-context"><span class="title">Context (colour)</span></div>
    <div class="legend" id="legend-rep"><span class="title">Representation (shape)</span></div>
  </div>
  <p class="hint">One mark per trial. Hover a mark for its details; click a legend item to show or hide it.</p>
  <div class="chart" id="chart"></div>
  <details>
    <summary>Table of every trial</summary>
    <table id="table"><thead><tr><th>Trial</th><th>Outcome</th><th>Bought</th><th>Reply</th></tr></thead><tbody></tbody></table>
  </details>
  <p class="foot">Measures P(obey) only: nothing yet labels whether the model interpreted the payload.</p>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = __DATA__;
const META = __META__;

const OUTCOMES = [
  { key: "obeyed", label: "Obeyed", note: "bought the injected item" },
  { key: "off_target", label: "Off-target call", note: "bought something else" },
  { key: "cut_off", label: "Cut off", note: "hit max_tokens, no call" },
  { key: "no_call", label: "No call", note: "answered without a tool" },
  { key: "error", label: "Errored", note: "excluded from rates" },
];
const SHAPES = ["circle", "square", "diamond", "triangle", "triangleDown", "plus", "star", "hexagon", "cross", "pentagon"];
const NS = "http://www.w3.org/2000/svg";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const bands = OUTCOMES.filter((o) => DATA.some((d) => d.outcome === o.key));
const prompts = META.prompts;
const contexts = META.contexts;
const reps = META.reps;
const colorVar = Object.fromEntries(contexts.map((c, i) => [c, `--c${(i % 3) + 1}`]));
let si = 0;
const shapeOf = Object.fromEntries(reps.map((r) => [r, r === "none" ? "ring" : SHAPES[si++ % SHAPES.length]]));
const pretty = (s) => (s === "none" ? "none (baseline)" : String(s).replaceAll("_", " "));
const active = { context: new Set(contexts), rep: new Set(reps) };

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function shape(kind, x, y, r, fill, parent) {
  const pts = (list) => list.map(([a, b]) => `${x + a * r},${y + b * r}`).join(" ");
  const stroke = { stroke: css("--surface"), "stroke-width": 1.5 };
  switch (kind) {
    case "circle": return el("circle", { cx: x, cy: y, r, fill, ...stroke }, parent);
    case "ring": return el("circle", { cx: x, cy: y, r: r * 0.85, fill: css("--surface"), stroke: fill, "stroke-width": 2.5 }, parent);
    case "square": return el("rect", { x: x - r * 0.85, y: y - r * 0.85, width: r * 1.7, height: r * 1.7, rx: 2, fill, ...stroke }, parent);
    case "diamond": return el("polygon", { points: pts([[0, -1.2], [1.2, 0], [0, 1.2], [-1.2, 0]]), fill, ...stroke }, parent);
    case "triangle": return el("polygon", { points: pts([[0, -1.15], [1.1, 0.85], [-1.1, 0.85]]), fill, ...stroke }, parent);
    case "triangleDown": return el("polygon", { points: pts([[0, 1.15], [1.1, -0.85], [-1.1, -0.85]]), fill, ...stroke }, parent);
    case "plus": return el("polygon", { points: pts([[-0.35, -1.1], [0.35, -1.1], [0.35, -0.35], [1.1, -0.35], [1.1, 0.35], [0.35, 0.35], [0.35, 1.1], [-0.35, 1.1], [-0.35, 0.35], [-1.1, 0.35], [-1.1, -0.35], [-0.35, -0.35]]), fill, ...stroke }, parent);
    case "cross": return el("polygon", { points: pts([[-0.8, -1.05], [0, -0.25], [0.8, -1.05], [1.05, -0.8], [0.25, 0], [1.05, 0.8], [0.8, 1.05], [0, 0.25], [-0.8, 1.05], [-1.05, 0.8], [-0.25, 0], [-1.05, -0.8]]), fill, ...stroke }, parent);
    case "star": {
      const p = [];
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5; const k = i % 2 ? 0.5 : 1.25; p.push([Math.cos(a) * k, Math.sin(a) * k]); }
      return el("polygon", { points: pts(p), fill, ...stroke }, parent);
    }
    default: {
      const n = kind === "hexagon" ? 6 : 5, p = [];
      for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; p.push([Math.cos(a) * 1.15, Math.sin(a) * 1.15]); }
      return el("polygon", { points: pts(p), fill, ...stroke }, parent);
    }
  }
}

function legendSwatch(kind, fill) {
  const s = el("svg", { width: 16, height: 16, viewBox: "0 0 16 16", "aria-hidden": "true" });
  shape(kind, 8, 8, 5.5, fill, s);
  return s;
}

function buildLegends() {
  const add = (container, group, keys, swatch) => {
    for (const k of keys) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", "true");
      b.append(swatch(k), document.createTextNode(pretty(k)));
      b.addEventListener("click", () => {
        const set = active[group];
        if (set.has(k)) set.delete(k); else set.add(k);
        b.setAttribute("aria-pressed", set.has(k) ? "true" : "false");
        applyFilter();
      });
      container.appendChild(b);
    }
  };
  add(document.getElementById("legend-context"), "context", contexts, (c) => legendSwatch("circle", css(colorVar[c])));
  add(document.getElementById("legend-rep"), "rep", reps, (r) => legendSwatch(shapeOf[r], css("--shape")));
}

function applyFilter() {
  document.querySelectorAll(".mark").forEach((m) => {
    const on = active.context.has(m.dataset.context) && active.rep.has(m.dataset.rep);
    m.classList.toggle("dim", !on);
  });
}

const tip = document.getElementById("tip");
function showTip(d, evt) {
  tip.replaceChildren();
  const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; tip.appendChild(e); return e; };
  add("div", "id", d.id + (META.epochs > 1 ? ` (epoch ${d.epoch})` : ""));
  const o = OUTCOMES.find((x) => x.key === d.outcome);
  add("div", "outcome", `${o.label}: ${o.note}`);
  const dl = document.createElement("dl");
  for (const [k, v] of [["Prompt", d.prompt], ["Context", pretty(d.context)], ["Representation", pretty(d.rep)], ["Bought", d.calls.length ? d.calls.join("; ") : "nothing"], ["Stop reason", d.stop || "n/a"]]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  tip.appendChild(dl);
  if (d.error) add("div", "reply", "Error: " + d.error);
  else if (d.response) add("div", "reply", d.response.length > 320 ? d.response.slice(0, 320) + "…" : d.response);
  tip.style.display = "block";
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = Math.max(8, evt.clientY - h - pad);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function draw() {
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const W = Math.max(600, Math.min(1040, chart.clientWidth || 1040));
  const left = 150, top = 34, gapX = 18, step = 20, r = 6.5;
  const colW = (W - left - gapX * (prompts.length - 1)) / prompts.length;
  const perRow = Math.max(1, Math.floor((colW - 56) / step));  // room for the count at top-left
  const cells = {};
  for (const d of DATA) (cells[`${d.outcome}|${d.prompt}`] ??= []).push(d);
  const ctxRank = Object.fromEntries(contexts.map((c, i) => [c, i]));
  const repRank = Object.fromEntries(reps.map((c, i) => [c, i]));
  for (const list of Object.values(cells)) list.sort((a, b) => ctxRank[a.context] - ctxRank[b.context] || repRank[a.rep] - repRank[b.rep] || a.epoch - b.epoch);
  const bandH = bands.map((b) => {
    const most = Math.max(1, ...prompts.map((p) => (cells[`${b.key}|${p}`] || []).length));
    return Math.max(56, Math.ceil(most / perRow) * step + 26);
  });
  const H = top + bandH.reduce((a, b) => a + b, 0) + 8;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Outcome of every trial by prompt; colour is context, shape is representation" }, chart);

  prompts.forEach((p, j) => {
    const x = left + j * (colW + gapX);
    el("text", { x: x + colW / 2, y: 18, "text-anchor": "middle", class: "col-label" }, svg).textContent = `prompt: ${p}`;
  });
  let y = top;
  bands.forEach((b, i) => {
    const h = bandH[i];
    prompts.forEach((p, j) => {
      el("rect", { x: left + j * (colW + gapX), y: y + 2, width: colW, height: h - 4, rx: 6, fill: css("--band") }, svg);
    });
    el("text", { x: 0, y: y + h / 2 - 2, class: "band-label" }, svg).textContent = b.label;
    el("text", { x: 0, y: y + h / 2 + 14, class: "band-note" }, svg).textContent = b.note;
    prompts.forEach((p, j) => {
      const list = cells[`${b.key}|${p}`] || [];
      const cx0 = left + j * (colW + gapX);
      const rows = Math.ceil(list.length / perRow);
      list.forEach((d, k) => {
        const row = Math.floor(k / perRow), col = k % perRow;
        const inRow = row < rows - 1 ? perRow : list.length - row * perRow;
        const cx = cx0 + colW / 2 + (col - (inRow - 1) / 2) * step;
        const cy = y + h / 2 + (row - (rows - 1) / 2) * step;
        const g = el("g", { class: "mark", tabindex: 0, "data-context": d.context, "data-rep": d.rep }, svg);
        shape(shapeOf[d.rep], cx, cy, r, css(colorVar[d.context]), g);
        const hit = el("circle", { cx, cy, r: step / 2, class: "hit" }, g);
        hit.addEventListener("mouseenter", (e) => showTip(d, e));
        hit.addEventListener("mousemove", moveTip);
        hit.addEventListener("mouseleave", hideTip);
        g.addEventListener("focus", () => { const bb = g.getBoundingClientRect(); showTip(d, { clientX: bb.right, clientY: bb.bottom }); });
        g.addEventListener("blur", hideTip);
      });
      el("text", { x: cx0 + 8, y: y + 16, class: "band-note" }, svg).textContent = list.length ? String(list.length) : "";
    });
    y += h;
  });
  applyFilter();
}

function buildTable() {
  const tb = document.querySelector("#table tbody");
  for (const d of DATA) {
    const tr = document.createElement("tr");
    const o = OUTCOMES.find((x) => x.key === d.outcome);
    for (const [v, cls] of [[d.id, "mono"], [o.label, ""], [d.calls.join("; ") || "nothing", ""], [(d.error ? "Error: " + d.error : d.response).slice(0, 200), ""]]) {
      const td = document.createElement("td"); td.textContent = v; if (cls) td.className = cls; tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
}

function buildHeader() {
  document.getElementById("sub").textContent = `${META.model} · ${META.run}`;
  const s = document.getElementById("stats");
  for (const [big, small] of META.stats) {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = big;
    const sp = document.createElement("span"); sp.textContent = small;
    d.append(b, sp); s.appendChild(d);
  }
}

buildHeader();
buildLegends();
buildTable();
draw();
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { document.querySelectorAll(".legend button").forEach((b) => b.remove()); buildLegends(); draw(); });
</script>
</body>
</html>

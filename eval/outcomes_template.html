<!doctype html>
<!-- Template for runs/<dir>/analysis/outcomes.html, filled in by eval/analyze_results.py.
     The DATA and META placeholders in the script below are replaced with JSON.
     Self-contained: no network needed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Outcomes</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --surface-2: #f3f2ef;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #8a8984;
    --rule: #e4e3df;
    --band: #f6f5f2;
    --neutral: #9a9994;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19;
      --surface-2: #242423;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --text-3: #8f8e86;
      --rule: #34342f;
      --band: #20201f;
      --neutral: #7c7b75;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19;
    --surface-2: #242423;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --rule: #34342f;
    --band: #20201f;
    --neutral: #7c7b75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; background: var(--surface); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-2); margin: 0 0 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 18px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); font-size: 12.5px; }
  .legends { display: grid; gap: 6px; margin: 0 0 6px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .legend .title { color: var(--text-2); font-size: 12.5px; width: 160px; flex: none; }
  .legend button {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 5px;
    border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
    color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .legend button[aria-pressed="false"] { opacity: 0.4; }
  .legend button:focus-visible { outline: 2px solid var(--text-2); outline-offset: 1px; }
  .hint { color: var(--text-3); font-size: 12px; margin: 6px 0 10px; }
  .chart { width: 100%; overflow-x: auto; }
  svg { display: block; }
  svg text { fill: var(--text-2); font-size: 12px; }
  svg .band-label { fill: var(--text); font-size: 13px; font-weight: 600; }
  svg .band-note { fill: var(--text-3); font-size: 11.5px; }
  .mark { transition: opacity 120ms; outline: none; }
  .mark.dim { opacity: 0.1; }
  .hit { cursor: pointer; fill: transparent; }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 360px; padding: 10px 12px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); font-size: 12.5px; display: none;
  }
  #tip .id { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--text-2); word-break: break-all; }
  #tip .outcome { font-weight: 600; margin: 4px 0; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
  #tip dt { color: var(--text-2); }
  #tip dd { margin: 0; }
  #tip .reply { color: var(--text-2); border-top: 1px solid var(--rule); padding-top: 6px; margin-top: 6px; white-space: pre-wrap; }
  details { margin-top: 22px; }
  summary { cursor: pointer; color: var(--text-2); }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .foot { color: var(--text-3); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>Run outcomes</h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <div class="legends">
    <div class="legend" id="legend-rep"><span class="title">Representation (colour)</span></div>
    <div class="legend" id="legend-context"><span class="title">Context (shape)</span></div>
    <div class="legend" id="legend-prompt"><span class="title">Prompt (border)</span></div>
    <div class="legend" id="legend-interp" hidden><span class="title">Interpretation (fill)</span></div>
  </div>
  <p class="hint">One mark per trial. Hover a mark for its details; click legend items to show or hide them.</p>
  <div class="chart" id="chart"></div>
  <details>
    <summary>Table of every trial</summary>
    <table id="table"><thead><tr><th>Trial</th><th>Outcome</th><th>Interpretation</th><th>Bought</th><th>Reply</th></tr></thead><tbody></tbody></table>
  </details>
  <p class="foot" id="foot"></p>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = __DATA__;
const META = __META__;

const OUTCOMES = [
  { key: "obeyed", label: "Obeyed", note: "bought the injected item" },
  { key: "off_target", label: "Off-target call", note: "bought something else" },
  { key: "cut_off", label: "Cut off", note: "hit max_tokens, no call" },
  { key: "no_call", label: "No call", note: "answered without a tool" },
  { key: "error", label: "Errored", note: "excluded from rates" },
];
// Five reference-palette hues chosen as the best all-pairs set (the representations
// share one plot area); hover, legend filtering and the table carry identity too.
// The baseline is neutral grey.
const PALETTE = ["#2a78d6", "#1baf7a", "#008300", "#eda100", "#e87ba4", "#6250d6", "#eb6834", "#e34948"];
// Interpretation (judge labels) is the fill: solid, light or hollow.
const INTERP = [
  { key: "interpreted", label: "interpreted", fill: "solid", note: "stated what the payload means" },
  { key: "perceived", label: "perceived only", fill: "light", note: "saw the payload, did not state its meaning" },
  { key: "not_perceived", label: "not perceived", fill: "hollow", note: "no sign it saw the payload" },
  { key: "not_judged", label: "not judged", fill: "solid", note: "no usable judge label" },
  { key: "n/a", label: "no payload / errored", fill: "solid", note: "baseline or errored, not judged" },
];
const interpOf = (k) => INTERP.find((x) => x.key === k) || INTERP[3];
const fillStyle = (k) => (META.labelled ? interpOf(k).fill : "solid");
const SHAPES = ["circle", "square", "triangle", "diamond", "triangleDown", "hexagon"];
const BORDERS = [null, { dash: null }, { dash: "2.5 2" }, { dash: "1 2" }];  // none, solid, dashed, dotted
const NS = "http://www.w3.org/2000/svg";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const bands = OUTCOMES.filter((o) => DATA.some((d) => d.outcome === o.key));
const { prompts, contexts, reps } = META;
let ci = 0;
const colorOf = Object.fromEntries(reps.map((r) => [r, r === "none" ? null : PALETTE[ci++ % PALETTE.length]]));
const fill = (rep) => colorOf[rep] || css("--neutral");
const shapeOf = Object.fromEntries(contexts.map((c, i) => [c, SHAPES[i % SHAPES.length]]));
const borderOf = Object.fromEntries(prompts.map((p, i) => [p, BORDERS[i % BORDERS.length]]));
const pretty = (s) => (s === "none" ? "none (baseline)" : String(s).replaceAll("_", " "));
const interps = INTERP.map((x) => x.key).filter((k) => DATA.some((d) => d.interp === k));
const active = { rep: new Set(reps), context: new Set(contexts), prompt: new Set(prompts), interp: new Set(interps) };

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// Draw one mark. `border` null = no border (a thin surface-coloured gap only).
// `style` solid | light | hollow: light and hollow fade the fill, and without a border
// they get a ring in the mark's own colour so the shape stays visible.
function shape(kind, x, y, r, color, border, parent, style = "solid") {
  const pts = (list) => list.map(([a, b]) => `${x + a * r},${y + b * r}`).join(" ");
  const stroke = border
    ? { stroke: css("--text"), "stroke-width": 2, "stroke-dasharray": border.dash, "stroke-linejoin": "round" }
    : style === "solid" ? { stroke: css("--surface"), "stroke-width": 1.5 }
    : { stroke: color, "stroke-width": 1.75, "stroke-linejoin": "round" };
  const attrs = { fill: color, "fill-opacity": { solid: 1, light: 0.4, hollow: 0.06 }[style], ...stroke };
  switch (kind) {
    case "circle": return el("circle", { cx: x, cy: y, r, ...attrs }, parent);
    case "square": return el("rect", { x: x - r * 0.88, y: y - r * 0.88, width: r * 1.76, height: r * 1.76, rx: 2, ...attrs }, parent);
    case "triangle": return el("polygon", { points: pts([[0, -1.2], [1.15, 0.9], [-1.15, 0.9]]), ...attrs }, parent);
    case "triangleDown": return el("polygon", { points: pts([[0, 1.2], [1.15, -0.9], [-1.15, -0.9]]), ...attrs }, parent);
    case "diamond": return el("polygon", { points: pts([[0, -1.25], [1.25, 0], [0, 1.25], [-1.25, 0]]), ...attrs }, parent);
    default: {
      const p = [];
      for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 3; p.push([Math.cos(a) * 1.15, Math.sin(a) * 1.15]); }
      return el("polygon", { points: pts(p), ...attrs }, parent);
    }
  }
}

function swatch(kind, color, border, style) {
  const s = el("svg", { width: 20, height: 20, viewBox: "0 0 20 20", "aria-hidden": "true" });
  shape(kind, 10, 10, 6.5, color, border, s, style);
  return s;
}

function buildLegends() {
  const add = (id, group, keys, sw) => {
    const box = document.getElementById(id);
    box.querySelectorAll("button").forEach((b) => b.remove());
    for (const k of keys) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", active[group].has(k) ? "true" : "false");
      b.append(sw(k), document.createTextNode(group === "interp" ? interpOf(k).label : pretty(k)));
      b.addEventListener("click", () => {
        const set = active[group];
        if (set.has(k)) set.delete(k); else set.add(k);
        b.setAttribute("aria-pressed", set.has(k) ? "true" : "false");
        applyFilter();
      });
      box.appendChild(b);
    }
  };
  const grey = css("--neutral");
  add("legend-rep", "rep", reps, (r) => swatch("circle", fill(r), null));
  add("legend-context", "context", contexts, (c) => swatch(shapeOf[c], grey, null));
  add("legend-prompt", "prompt", prompts, (p) => swatch("circle", grey, borderOf[p]));
  if (META.labelled) {
    document.getElementById("legend-interp").hidden = false;
    add("legend-interp", "interp", interps, (k) => swatch("circle", k === "n/a" ? grey : PALETTE[0], null, fillStyle(k)));
  }
}

function applyFilter() {
  document.querySelectorAll(".mark").forEach((m) => {
    const on = active.rep.has(m.dataset.rep) && active.context.has(m.dataset.context) && active.prompt.has(m.dataset.prompt)
      && (!META.labelled || active.interp.has(m.dataset.interp));
    m.classList.toggle("dim", !on);
  });
}

const tip = document.getElementById("tip");
function showTip(d, evt) {
  tip.replaceChildren();
  const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; tip.appendChild(e); return e; };
  add("div", "id", d.id + (META.epochs > 1 ? ` (epoch ${d.epoch})` : ""));
  const o = OUTCOMES.find((x) => x.key === d.outcome);
  add("div", "outcome", `${o.label}: ${o.note}`);
  const dl = document.createElement("dl");
  const rows = [["Representation", pretty(d.rep)], ["Context", pretty(d.context)], ["Prompt", d.prompt], ["Bought", d.calls.length ? d.calls.join("; ") : "nothing"], ["Stop reason", d.stop || "n/a"]];
  rows.push(["Interpretation", interpLabel(d)]);
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  tip.appendChild(dl);
  if (META.labelled && d.rationale) add("div", "reply", "Judge: " + d.rationale);
  if (d.error) add("div", "reply", "Error: " + d.error);
  else if (d.response) add("div", "reply", d.response.length > 320 ? d.response.slice(0, 320) + "…" : d.response);
  tip.style.display = "block";
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = Math.max(8, evt.clientY - h - pad);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function interpLabel(d) {
  if (!META.labelled) return "not judged (no labels for this run)";
  const x = interpOf(d.interp);
  return `${x.label}: ${x.note}`;
}

function draw() {
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const W = Math.max(520, Math.min(1040, chart.clientWidth || 1040));
  const left = 160, step = 26, r = 8;
  const cellW = W - left;
  const perRow = Math.max(1, Math.floor((cellW - 64) / step));  // room for the count at the left
  const rank = (list) => Object.fromEntries(list.map((k, i) => [k, i]));
  const rr = rank(reps), cr = rank(contexts), pr = rank(prompts);
  const cells = {};
  for (const d of DATA) (cells[d.outcome] ??= []).push(d);
  for (const list of Object.values(cells)) {
    list.sort((a, b) => rr[a.rep] - rr[b.rep] || cr[a.context] - cr[b.context] || pr[a.prompt] - pr[b.prompt] || a.epoch - b.epoch);
  }
  const bandH = bands.map((b) => Math.max(64, Math.ceil((cells[b.key] || []).length / perRow) * step + 30));
  const H = bandH.reduce((a, b) => a + b, 0) + 4;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Outcome of every trial; colour is representation, shape is context, border is prompt"
      + (META.labelled ? ", fill is interpretation" : "") }, chart);

  let y = 0;
  bands.forEach((b, i) => {
    const h = bandH[i], list = cells[b.key] || [];
    el("rect", { x: left, y: y + 3, width: cellW, height: h - 6, rx: 6, fill: css("--band") }, svg);
    el("text", { x: 0, y: y + h / 2 - 2, class: "band-label" }, svg).textContent = b.label;
    el("text", { x: 0, y: y + h / 2 + 14, class: "band-note" }, svg).textContent = b.note;
    el("text", { x: left + 12, y: y + h / 2 + 4, class: "band-note" }, svg).textContent = String(list.length);
    const rows = Math.ceil(list.length / perRow);
    list.forEach((d, k) => {
      const row = Math.floor(k / perRow), col = k % perRow;
      const cx = left + 52 + col * step + step / 2;
      const cy = y + h / 2 + (row - (rows - 1) / 2) * step;
      const g = el("g", { class: "mark", tabindex: 0, "data-rep": d.rep, "data-context": d.context, "data-prompt": d.prompt, "data-interp": d.interp }, svg);
      shape(shapeOf[d.context], cx, cy, r, fill(d.rep), borderOf[d.prompt], g, fillStyle(d.interp));
      const hit = el("circle", { cx, cy, r: step / 2, class: "hit" }, g);
      hit.addEventListener("mouseenter", (e) => showTip(d, e));
      hit.addEventListener("mousemove", moveTip);
      hit.addEventListener("mouseleave", hideTip);
      g.addEventListener("focus", () => { const bb = g.getBoundingClientRect(); showTip(d, { clientX: bb.right, clientY: bb.bottom }); });
      g.addEventListener("blur", hideTip);
    });
    y += h;
  });
  applyFilter();
}

function buildTable() {
  const tb = document.querySelector("#table tbody");
  for (const d of DATA) {
    const tr = document.createElement("tr");
    const o = OUTCOMES.find((x) => x.key === d.outcome);
    const it = META.labelled ? interpOf(d.interp).label : "not judged";
    for (const [v, cls] of [[d.id, "mono"], [o.label, ""], [it, ""], [d.calls.join("; ") || "nothing", ""], [(d.error ? "Error: " + d.error : d.response).slice(0, 200), ""]]) {
      const td = document.createElement("td"); td.textContent = v; if (cls) td.className = cls; tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
}

function buildHeader() {
  document.getElementById("sub").textContent = `${META.model} · ${META.run}`;
  const s = document.getElementById("stats");
  for (const [big, small] of META.stats) {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = big;
    const sp = document.createElement("span"); sp.textContent = small;
    d.append(b, sp); s.appendChild(d);
  }
  document.getElementById("foot").textContent = META.foot;
}

buildHeader();
buildLegends();
buildTable();
draw();
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { buildLegends(); draw(); });
</script>
</body>
</html>

name: stimuli determinism

# Re-renders every stimulus on each OS and fails if the committed manifest
# (and so any image_sha256) would change.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "stimuli/**"
      - "harness/manifest.py"
      - ".github/workflows/stimuli-determinism.yml"

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Pillow
        run: python -m pip install -r stimuli/requirements.txt pytest
      - name: Regenerate stimuli
        run: python stimuli/generate.py
      - name: Committed manifest must be unchanged
        shell: bash
        run: |
          git diff --exit-code --stat -- stimuli/manifest.jsonl
          if git ls-files --error-unmatch stimuli/manifest.json >/dev/null 2>&1; then
            git diff --exit-code --stat -- stimuli/manifest.json
          fi
      - name: Render-hash test
        run: python -m pytest stimuli/tests/test_deterministic_render.py -q

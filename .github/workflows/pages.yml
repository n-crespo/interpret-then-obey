name: pages

# Publishes the committed run pages (runs/*/analysis/*.html) and runs/coverage.html
# to GitHub Pages, with a generated index.html linking every run. Pages serves no directory
# listings, so without the index the pages are only reachable by exact URL.

on:
  push:
    branches: [main]
    paths:
      - "runs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        shell: python
        run: |
          import html, shutil
          from pathlib import Path

          site = Path("_site")
          items = []
          for run in sorted(Path("runs").iterdir(), reverse=True):
              pages = sorted(run.glob("analysis/*.html"))
              if not pages:
                  continue
              for page in pages:
                  (site / page).parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(page, site / page)
              links = " · ".join(
                  f'<a href="{html.escape(p.as_posix())}">{html.escape(p.stem)}</a>' for p in pages
              )
              items.append(f"<li><code>{html.escape(run.name)}</code> — {links}</li>")

          note = ""
          coverage = Path("runs/coverage.html")
          if coverage.exists():
              (site / coverage).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(coverage, site / coverage)
              note = (f'<p class=note><a href="{coverage.as_posix()}">Run coverage</a>: which rows the '
                      "2026-11-24 run covered, which the next run adds, and which were removed, and why.</p>")

          (site / "index.html").write_text(
              "<!doctype html><meta charset=utf-8>"
              '<meta name=viewport content="width=device-width,initial-scale=1">'
              "<title>Runs</title>"
              "<style>body{font:16px/1.6 system-ui,sans-serif;max-width:48rem;margin:2rem auto;padding:0 1rem}"
              ".note{border-left:3px solid #8ab4f8;padding:.25rem .75rem}"
              "@media(prefers-color-scheme:dark){body{background:#111;color:#ddd}a{color:#8ab4f8}}</style>"
              f"<h1>Runs</h1>{note}<ul>{''.join(items)}</ul>\n",
              encoding="utf-8",
          )

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

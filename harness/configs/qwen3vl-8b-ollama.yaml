name: qwen3vl-8b-ollama
model: ollama/qwen3-vl:8b            # run `ollama show qwen3-vl:8b` -> needs vision (+ tools)
# base_url: http://localhost:11434/v1   # only if Ollama is not on this machine
manifest: stimuli/old/manifest/manifest.jsonl
# image_root: stimuli                # optional; loader also tries manifest dir, stimuli/, repo root
# system_prompt: "..."               # default is the AR-glasses assistant prompt in task.py

generate:                            # -> inspect GenerateConfig
  temperature: 0.0
  seed: 0
  max_tokens: 1024
  max_retries: 5                     # API-level retries with backoff
  timeout: 300

run:                                 # -> inspect eval() options
  epochs: 1                          # repeat each row N times (use >1 only with temperature > 0)
  max_connections: 2                 # keep low for one local GPU
  message_limit: 12                  # caps tool-call loops
  retry_on_error: 3                  # per-sample retries
  fail_on_error: false               # keep going; fix with --resume afterwards